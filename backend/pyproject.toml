[project]
name = "aegis"
version = "1.0.0"
description = "Attack-stage forecasting service (CIC-IDS2017 world model)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning"]
